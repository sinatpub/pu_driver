name: pu_taxi_driver
description: "The Pu Taxi Driver App helps drivers get ride requests, navigate with live maps, manage trips, and track earnings—all in one simple and easy-to-use app."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.1.9+1191

environment:
  sdk: '>=3.4.3 <4.0.0'
  
dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6

  # translate
  easy_localization: ^3.0.0

  # dependacy injectin

  # network request
  http: ^1.2.2

  # flutter svg
  flutter_svg: ^2.0.10+1

  # switch toggle
  flutter_switch: ^0.3.2

  # dotted line
  dotted_line: ^3.2.2

  # google map
  geolocator: ^14.0.1
  geocoding: ^4.0.0
  location: ^8.0.0
  google_maps_flutter: ^2.6.1

  # local notification
  flutter_local_notifications: ^19.5.0

  # vibrate device

  # logger 
  logger: ^2.4.0

  # pinput otp
  pinput: ^5.0.0
  
  dropdown_button2: ^2.3.9
  image_picker: ^1.1.2
  permission_handler: ^12.0.0+1
  dio: ^5.7.0
  pretty_dio_logger: ^1.4.0
  socket_io_client: ^3.0.0
  device_info_plus: ^11.0.0
  shared_preferences: ^2.3.2
  shimmer: ^3.0.0

  flutter_polyline_points: ^2.1.0
  url_launcher: ^6.3.1

  # Keyboard Dismisser
  keyboard_dismisser: ^3.0.0

  # firebase packages
  firebase_core: ^4.2.1
  firebase_messaging: ^16.0.4
  #  flutter_local_notifications: ^19.5.0
  firebase_crashlytics: ^5.0.5
#  firebase_analytics: ^12.0.4

  # loading
  flutter_easyloading: ^3.0.5
  

  # smart otp auto fill
  internet_connection_checker_plus: ^2.7.2
  flutter_secure_storage: ^10.3.1
  get: ^4.7.3
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.0.0
  share_plus: ^12.0.0
  
dependency_overrides:
  geolocator_android: 4.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6


# Native launch screen: same logo and background as the launcher icon, so the
# OS splash, the Flutter splash and the home-screen icon read as one mark.
# Regenerate with `dart run flutter_native_splash:create`.
flutter_native_splash:
  color: "#2B3647"
  image: "assets/launcher/adaptive_foreground_driver_1024.png"
  android_12:
    color: "#2B3647"
    image: "assets/launcher/adaptive_foreground_driver_1024.png"
    icon_background_color: "#2B3647"
  fullscreen: false


flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/launcher/launcher_driver_1024.png"
  adaptive_icon_background: "#2B3647"
  adaptive_icon_foreground: "assets/launcher/adaptive_foreground_driver_1024.png"
  min_sdk_android: 21
  background_color_ios: "#2B3647"
  remove_alpha_ios: true


flutter:

  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/
    - assets/marker/
    - assets/marker/car_marker.png
    - assets/marker/Rickshaw.png
    - assets/marker/mini_van.png
    - assets/marker/alphard_vip.png
    - assets/marker/SUV.png
    - assets/marker/classis_car.png
    - assets/image/country/
    - assets/image/svg/
    - assets/image/png/
    # - assets/image/png/
    - assets/icon/svg/
    - assets/icon/ds/
    - assets/icon/png/
    - assets/launcher/
    - assets/nav_icon/
    - assets/translations/km.json
    - assets/translations/en.json
    - assets/translations/
    - assets/sounds/booking_sound.wav


  fonts:
    - family: KantumruyPro
      fonts:
        - asset: fonts/KantumruyPro-VariableFont_wght.ttf
    - family: KantumruyPro-SemiBold
      fonts:
        - asset: fonts/KantumruyPro-SemiBold.ttf
    - family: KantumruyPro-Regular
      fonts:
        - asset: fonts/KantumruyPro-Regular.ttf

